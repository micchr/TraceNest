<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="tracenest animated processing pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#161b22"/>
    </radialGradient>
    <filter id="pglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="260" fill="url(#pbg)"/>
  <text x="20" y="30" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#d7e0ea">trace<tspan fill="#39ff14">nest</tspan> · ingest → nest → analyze → report</text>

  <!-- connecting rails -->
  <g stroke="#242c38" stroke-width="2" fill="none">
    <line x1="150" y1="140" x2="270" y2="140"/>
    <line x1="390" y1="140" x2="510" y2="140"/>
    <line x1="270" y1="140" x2="390" y2="140"/>
    <line x1="510" y1="140" x2="630" y2="140"/>
  </g>

  <!-- flowing neon packets along the rails -->
  <g fill="#39ff14" filter="url(#pglow)">
    <circle r="4" cx="0" cy="140">
      <animate attributeName="cx" values="150;630" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cx="0" cy="140">
      <animate attributeName="cx" values="150;630" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- stage nodes -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="middle">
    <g>
      <circle cx="90" cy="140" r="40" fill="url(#node)" stroke="#5bd6ff" stroke-width="1.5"/>
      <text x="90" y="136" fill="#d7e0ea">parse</text>
      <text x="90" y="152" fill="#8a94a6" font-size="10">JSON/JSONL</text>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="330" cy="140" r="40" fill="url(#node)" stroke="#c8ff5b" stroke-width="1.5"/>
      <text x="330" y="136" fill="#d7e0ea">nest</text>
      <text x="330" y="152" fill="#8a94a6" font-size="10">tree</text>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="450" cy="140" r="40" fill="url(#node)" stroke="#00e0a4" stroke-width="1.5"/>
      <text x="450" y="132" fill="#d7e0ea">analyze</text>
      <text x="450" y="148" fill="#8a94a6" font-size="10">crit path</text>
      <text x="450" y="162" fill="#8a94a6" font-size="10">retries</text>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="600" cy="140" r="40" fill="url(#node)" stroke="#39ff14" stroke-width="1.5" filter="url(#pglow)"/>
      <text x="600" y="136" fill="#d7e0ea">report</text>
