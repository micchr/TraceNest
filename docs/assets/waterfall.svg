<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">tracenest span waterfall</title>
  <desc id="wfDesc">A nested span waterfall for the sample agent run. Bars are positioned by start offset and sized by duration, indented by nesting depth, colored by kind. The reasoner.llm and code.exec rows carry a green rail marking the critical path, and the errored code.exec attempt is labeled in red.</desc>
  <rect width="720" height="300" fill="#12161d"/>
  <rect x="0" y="0" width="720" height="34" fill="#161b22"/>
  <text x="20" y="22" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#d7e0ea">trace<tspan fill="#39ff14">nest</tspan> · span waterfall</text>

  <!-- gridlines for the time axis -->
  <g stroke="#242c38" stroke-width="1">
    <line x1="240" y1="44" x2="240" y2="284"/>
    <line x1="380" y1="44" x2="380" y2="284"/>
    <line x1="520" y1="44" x2="520" y2="284"/>
    <line x1="660" y1="44" x2="660" y2="284"/>
  </g>

  <!-- critical-path rail down the left edge of the dominant chain rows -->
  <rect x="232" y="146" width="4" height="80" fill="#39ff14"/>

  <g font-family="ui-monospace,Consolas,monospace" font-size="11">
