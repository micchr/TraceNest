name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile package
        run: python -m compileall -q tracenest
      - name: Smoke run (analyze)
        run: python -m tracenest analyze examples/agent_run.json
      - name: Smoke run (tree)
        run: python -m tracenest tree examples/rag_session.jsonl
      - name: Render JSON report
